name: release

on:
  push:
    tags:
      - 'v*'

# A release starts with no ambient authority.  Each job grants only the
# permission it needs below.
permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate, test, and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tested_commit: ${{ steps.release.outputs.tested_commit }}
      version: ${{ steps.release.outputs.version }}
      bundle: ${{ steps.release.outputs.bundle }}
      checksum: ${{ steps.release.outputs.checksum }}
    steps:
      - name: Check out the exact tag (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate immutable release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release tags must be vMAJOR.MINOR.PATCH: $RELEASE_TAG" >&2
            exit 1
          }
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          # A lightweight tag has no signed/annotated tag object to audit.  Do
          # not let it enter the release pipeline accidentally.
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag || {
            echo "$RELEASE_TAG must be an annotated tag" >&2
            exit 1
          }
          tested_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$tested_commit"

          # Fetch main again on every attempt.  A tag push can race the merge
          # that makes its commit visible on origin/main; bounded retries avoid
          # both a false rejection and an unbounded release job.
          main_seen=false
          for attempt in {1..20}; do
            git fetch --no-tags --prune origin \
              +refs/heads/main:refs/remotes/origin/main
            if git merge-base --is-ancestor "$tested_commit" \
              refs/remotes/origin/main; then
              main_seen=true
              break
            fi
            echo "waiting for $tested_commit to appear on freshly fetched origin/main ($attempt/20)"
            sleep 15
          done
          test "$main_seen" = true || {
            echo "$RELEASE_TAG ($tested_commit) is not an ancestor of origin/main" >&2
            exit 1
          }

          version="${RELEASE_TAG#v}"
          test "$(cat VERSION)" = "$version"
          ./scripts/verify-release-version.sh
          grep -Eq "^##[[:space:]]+$version([[:space:]]|$|—)" CHANGELOG.md
          {
            echo "tested_commit=$tested_commit"
            echo "version=$version"
            echo "bundle=AgentOTelStack-v$version.tar.gz"
            echo "checksum=AgentOTelStack-v$version.tar.gz.sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for CI success for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_COMMIT: ${{ steps.release.outputs.tested_commit }}
        shell: bash
        run: |
          set -euo pipefail
          api_get() {
            local destination=$1 route=$2 err attempt
            err="${destination}.err"
            for attempt in {1..6}; do
              if gh api "$route" >"$destination" 2>"$err"; then
                rm -f "$err"
                return 0
              fi
              # gh does not retry all HTTP/network failures.  Keep retries
              # bounded and retry only errors that may clear transiently.
              if ! grep -Eiq 'HTTP (408|425|429|5[0-9][0-9])|rate limit|timed out|timeout|temporar|connection reset|TLS handshake' "$err"; then
                cat "$err" >&2
                return 1
              fi
              echo "transient GitHub API failure (attempt $attempt/6); retrying" >&2
              sleep $((attempt * 5))
            done
            cat "$err" >&2
            return 1
          }
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            # The newest push run for this exact commit is authoritative.  Do
            # not accept an older success while a newer rerun is in progress
            # or has failed.  gh retries transient API failures itself.
            runs_file="$RUNNER_TEMP/ci-runs.json"
            api_get "$runs_file" \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$TESTED_COMMIT&event=push&per_page=100" || {
              echo 'transient GitHub Actions API failure; retrying' >&2
              sleep 15
              continue
            }
            latest="$(jq -c --arg sha "$TESTED_COMMIT" '

              [.workflow_runs[] | select(.head_sha == $sha and .event == "push")] |
              sort_by([.created_at, .id]) | last // empty' "$runs_file")"
            if [ -n "$latest" ]; then
              run_id="$(printf '%s' "$latest" | jq -r .id)"
              status="$(printf '%s' "$latest" | jq -r .status)"
              conclusion="$(printf '%s' "$latest" | jq -r '.conclusion // ""')"
              if [ "$status" = completed ]; then
                test "$conclusion" = success || {
                  echo "authoritative ci.yml run $run_id concluded $conclusion" >&2
                  exit 1
                }
                jobs_file="$RUNNER_TEMP/ci-jobs.json"
                api_get "$jobs_file" \
                  "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" || {
                  echo 'transient GitHub Actions jobs API failure; retrying' >&2
                  sleep 15
                  continue
                }
                jq -e '
                  (.total_count > 0) and ([.jobs[] | .conclusion] | all(. == "success"))' >/dev/null || {
                  echo "ci.yml run $run_id has a job without success conclusion" >&2
                  exit 1
                } < "$jobs_file"
                echo "authoritative ci.yml run $run_id passed for $TESTED_COMMIT"
                exit 0
              fi
            fi
            echo "waiting for ci.yml on $TESTED_COMMIT"
            sleep 15
          done
          echo "timed out waiting for ci.yml on $TESTED_COMMIT" >&2
          exit 1

      - name: Run release/source unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/test-ci-local.sh
          ./tests/runtime/release_version.sh
          bash tests/runtime/install_lifecycle.sh
          bash tests/runtime/image_tags_rollback.sh

      - name: Build and verify the source bundle
        id: bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          ./scripts/build-release-source.sh "$RELEASE_TAG" dist

      - name: Upload the prepared bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish stable GitHub release
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write
    steps:
      # This job intentionally does not check out the tag or execute anything
      # from it.  Only the already-tested artifact crosses the job boundary.
      - name: Download the tested bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle-${{ github.run_id }}
          path: dist

      - name: Self-test stable latest-release policy
        shell: bash
        run: |
          set -euo pipefail
          # $version is intentionally a jq variable, not shell expansion.
          # shellcheck disable=SC2016
          policy='
            def v:
              capture("^v(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)$") |
              [(.major | tonumber), (.minor | tonumber), (.patch | tonumber)];
            ([.[] | select((.draft | not) and (.prerelease | not)) |
              .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | v] |
              max // [0,0,0]) as $max |
            (("v" + $version) | v) as $current |
            if $current >= $max then "true" else "legacy" end
          '
          policy_expect() {
            local expected=$1 version=$2 releases=$3 actual
            actual="$(printf '%s' "$releases" | jq -r --arg version "$version" "$policy")"
            test "$actual" = "$expected" || {
              echo "latest policy expected $expected for v$version, got $actual ($releases)" >&2
              exit 1
            }
          }
          policy_expect true 2.1.0 '[]'
          policy_expect true 2.1.0 '[{"tag_name":"v2.0.1","draft":false,"prerelease":false}]'
          policy_expect true 2.1.0 '[{"tag_name":"v2.1.0","draft":false,"prerelease":false}]'
          policy_expect true 2.1.0 '[{"tag_name":"v2.1.0","draft":true,"prerelease":false}]'
          policy_expect true 2.1.0 '[{"tag_name":"v9.0.0-rc.1","draft":false,"prerelease":true},{"tag_name":"v9.0.0","draft":true,"prerelease":false}]'
          policy_expect legacy 2.1.0 '[{"tag_name":"v2.2.0","draft":false,"prerelease":false}]'
          policy_expect legacy 2.1.0 '[{"tag_name":"v3.0.0","draft":false,"prerelease":false}]'
          policy_expect true 2.10.0 '[{"tag_name":"v2.9.99","draft":false,"prerelease":false}]'
          policy_expect legacy 2.9.99 '[{"tag_name":"v2.10.0","draft":false,"prerelease":false}]'
          echo 'stable latest-release policy: PASS'

      - name: Re-verify tag, checksum, and release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TESTED_COMMIT: ${{ needs.validate.outputs.tested_commit }}
          VERSION: ${{ needs.validate.outputs.version }}
          BUNDLE: ${{ needs.validate.outputs.bundle }}
          CHECKSUM: ${{ needs.validate.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          api_get() {
            local destination=$1 route=$2 header=${3:-} err attempt
            err="${destination}.err"
            for attempt in {1..6}; do
              if [ -n "$header" ]; then
                if gh api -H "$header" "$route" >"$destination" 2>"$err"; then
                  rm -f "$err"
                  return 0
                fi
              elif gh api "$route" >"$destination" 2>"$err"; then
                rm -f "$err"
                return 0
              fi
              if ! grep -Eiq 'HTTP (408|425|429|5[0-9][0-9])|rate limit|timed out|timeout|temporar|connection reset|TLS handshake' "$err"; then
                cat "$err" >&2
                return 1
              fi
              echo "transient GitHub API failure (attempt $attempt/6); retrying" >&2
              sleep $((attempt * 5))
            done
            cat "$err" >&2
            return 1
          }
          resolve_tag_commit() {
            local ref_file=$RUNNER_TEMP/tag-ref.json tag_file object_type object_sha depth
            api_get "$ref_file" "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
            object_type="$(jq -r '.object.type' "$ref_file")"
            object_sha="$(jq -r '.object.sha' "$ref_file")"
            test "$object_type" = tag || {
              echo "$RELEASE_TAG is not annotated at the GitHub API boundary" >&2
              return 1
            }
            depth=0
            while [ "$object_type" = tag ]; do
              depth=$((depth + 1))
              test "$depth" -le 4 || { echo 'nested tag depth exceeds limit' >&2; return 1; }
              tag_file="$RUNNER_TEMP/tag-object-$depth.json"
              api_get "$tag_file" "repos/$GITHUB_REPOSITORY/git/tags/$object_sha"
              object_type="$(jq -r '.object.type' "$tag_file")"
              object_sha="$(jq -r '.object.sha' "$tag_file")"
            done
            test "$object_type" = commit || { echo 'tag does not peel to a commit' >&2; return 1; }
            printf '%s\n' "$object_sha"
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          remote_commit="$(resolve_tag_commit)"
          test "$remote_commit" = "$TESTED_COMMIT"
          test -f "dist/$BUNDLE"; test -f "dist/$CHECKSUM"
          (cd dist && sha256sum --check "$CHECKSUM")

      - name: Create or reuse the stable release and upload exact assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
          BUNDLE: ${{ needs.validate.outputs.bundle }}
          CHECKSUM: ${{ needs.validate.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          api_get() {
            local destination=$1 route=$2 header=${3:-} err attempt
            err="${destination}.err"
            for attempt in {1..6}; do
              if [ -n "$header" ]; then
                if gh api -H "$header" "$route" >"$destination" 2>"$err"; then
                  rm -f "$err"
                  return 0
                fi
              elif gh api "$route" >"$destination" 2>"$err"; then
                rm -f "$err"
                return 0
              fi
              if ! grep -Eiq 'HTTP (408|425|429|5[0-9][0-9])|rate limit|timed out|timeout|temporar|connection reset|TLS handshake' "$err"; then
                cat "$err" >&2
                return 1
              fi
              echo "transient GitHub API failure (attempt $attempt/6); retrying" >&2
              sleep $((attempt * 5))
            done
            cat "$err" >&2
            return 1
          }
          api_get_all_releases() {
            local destination=$1 page=1 count page_file merged
            printf '[]\n' > "$destination"
            while [ "$page" -le 100 ]; do
              page_file="$RUNNER_TEMP/releases-page-$page.json"
              api_get "$page_file" "repos/$GITHUB_REPOSITORY/releases?per_page=100&page=$page"
              count="$(jq 'length' "$page_file")"
              merged="$RUNNER_TEMP/releases-merged-$page.json"
              jq -s '.[0] + .[1]' "$destination" "$page_file" > "$merged"
              cp "$merged" "$destination"
              [ "$count" -lt 100 ] && return 0
              page=$((page + 1))
            done
            echo 'release listing exceeded pagination safety bound' >&2
            return 1
          }
          resolve_tag_commit() {
            local ref_file=$RUNNER_TEMP/publish-tag-ref.json tag_file object_type object_sha depth
            api_get "$ref_file" "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG"
            object_type="$(jq -r '.object.type' "$ref_file")"
            object_sha="$(jq -r '.object.sha' "$ref_file")"
            test "$object_type" = tag || { echo "$RELEASE_TAG is not annotated" >&2; return 1; }
            depth=0
            while [ "$object_type" = tag ]; do
              depth=$((depth + 1))
              test "$depth" -le 4 || { echo 'nested tag depth exceeds limit' >&2; return 1; }
              tag_file="$RUNNER_TEMP/publish-tag-object-$depth.json"
              api_get "$tag_file" "repos/$GITHUB_REPOSITORY/git/tags/$object_sha"
              object_type="$(jq -r '.object.type' "$tag_file")"
              object_sha="$(jq -r '.object.sha' "$tag_file")"
            done
            test "$object_type" = commit || { echo 'tag does not peel to a commit' >&2; return 1; }
            printf '%s\n' "$object_sha"
          }
          notes="$(mktemp)"
          # This file is carried in the tested source bundle; deriving notes
          # here keeps the publish job from executing tag-controlled code.
          tar -xOzf "dist/$BUNDLE" "AgentOTelStack-v$VERSION/CHANGELOG.md" |
            awk -v version="$VERSION" '
              $0 ~ "^##[[:space:]]+" version "([[:space:]]|$|—)" { found=1; next }
              found && /^##[[:space:]]+/ { exit }
              found { print }
              END { if (!found) exit 1 }
          ' > "$notes"
          test -s "$notes"
          release_name="AgentOTelStack v$VERSION"
          notes_digest="$(sha256sum "$notes" | awk '{print $1}')"

          # An existing published release is never edited or overwritten.  A
          # draft may be reused only after its tag and every existing asset are
          # checked below; mismatches fail closed.
          release_json="$RUNNER_TEMP/release.json"
          if api_get "$release_json" "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"; then
            release_id="$(jq -r .id "$release_json")"
            test "$(jq -r .tag_name "$release_json")" = "$RELEASE_TAG"
            test "$(jq -r .draft "$release_json")" = true || {
              echo "published release $RELEASE_TAG already exists; refusing to edit it" >&2
              exit 1
            }
            test "$(jq -r .prerelease "$release_json")" = false || {
              echo "existing draft $RELEASE_TAG is prerelease; refusing to publish it as stable" >&2
              exit 1
            }
            test "$(jq -r .name "$release_json")" = "$release_name" || {
              echo "existing draft has an unexpected name; refusing to reuse it" >&2
              exit 1
            }
            test "$(jq -r .body "$release_json" | sha256sum | awk '{print $1}')" = "$notes_digest" || {
              echo "existing draft notes differ; refusing to reuse it" >&2
              exit 1
            }
          else
            # A 404 is the only expected failure: the release does not exist.
            # api_get has already retried transient failures and printed any
            # permanent non-404 error.  Re-check the response text to avoid
            # treating authentication or outage errors as a missing release.
            if ! grep -Eiq 'HTTP 404|Not Found' "${release_json}.err" 2>/dev/null; then
              echo 'unable to resolve existing release safely' >&2
              exit 1
            fi
            rm -f "${release_json}.err"
            release_id=""
          fi

          bundle_size="$(wc -c < "dist/$BUNDLE" | tr -d '[:space:]')"
          checksum_size="$(wc -c < "dist/$CHECKSUM" | tr -d '[:space:]')"
          assets_json="$RUNNER_TEMP/assets.json"
          if [ -n "$release_id" ]; then
            api_get "$assets_json" "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100"
            jq -e --arg bundle "$BUNDLE" --arg checksum "$CHECKSUM" \
              'all(.[]; .name == $bundle or .name == $checksum)' "$assets_json" >/dev/null || {
              echo 'draft contains an unexpected release asset; refusing to reuse it' >&2
              exit 1
            }
          else
            printf '[]\n' > "$assets_json"
          fi

          upload_if_missing_or_identical() {
            local name=$1 local_path=$2 expected_size=$3 record asset_id remote_path err attempt refresh
            record="$(jq -c --arg name "$name" '[.[] | select(.name == $name)] | if length == 1 then .[0] else empty end' "$assets_json")"
            if [ -z "$record" ]; then
              test -n "$release_id" || return 0
              err="$RUNNER_TEMP/upload-$name.err"
              for attempt in {1..6}; do
                if gh release upload "$RELEASE_TAG" "$local_path" > /dev/null 2>"$err"; then
                  return 0
                fi
                # The upload may have committed before its response was lost.
                # Recover only a byte-identical asset; never overwrite.
                refresh="$RUNNER_TEMP/assets-$name-$attempt.json"
                api_get "$refresh" "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" || return 1
                record="$(jq -c --arg name "$name" '[.[] | select(.name == $name)] | if length == 1 then .[0] else empty end' "$refresh")"
                if [ -n "$record" ]; then
                  asset_id="$(printf '%s' "$record" | jq -r .id)"
                  test "$(printf '%s' "$record" | jq -r .size)" = "$expected_size" || return 1
                  remote_path="$RUNNER_TEMP/upload-recovered-$asset_id"
                  api_get "$remote_path" "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" 'Accept: application/octet-stream' || return 1
                  cmp -s "$local_path" "$remote_path" && return 0
                  echo "recovered upload $name differs; refusing overwrite" >&2
                  return 1
                fi
                if ! grep -Eiq 'HTTP (408|425|429|5[0-9][0-9])|rate limit|timed out|timeout|temporar|connection reset|TLS handshake' "$err"; then
                  cat "$err" >&2
                  return 1
                fi
                echo "transient upload failure for $name (attempt $attempt/6); retrying" >&2
                sleep $((attempt * 5))
              done
              cat "$err" >&2
              return 1
            fi
            test "$(printf '%s' "$record" | jq -r .size)" = "$expected_size" || {
              echo "draft asset $name has a different size" >&2
              return 1
            }
            asset_id="$(printf '%s' "$record" | jq -r .id)"
            remote_path="$RUNNER_TEMP/remote-$asset_id"
            api_get "$remote_path" "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" 'Accept: application/octet-stream'
            cmp -s "$local_path" "$remote_path" || {
              echo "draft asset $name differs; refusing to replace it" >&2
              return 1
            }
            return 0
          }
          verify_remote_asset() {
            local name=$1 local_path=$2 expected_size=$3 record asset_id remote_path
            record="$(jq -c --arg name "$name" '[.[] | select(.name == $name)] | if length == 1 then .[0] else empty end' "$final_assets")"
            test -n "$record" || { echo "missing remote asset $name" >&2; return 1; }
            asset_id="$(printf '%s' "$record" | jq -r .id)"
            test "$(printf '%s' "$record" | jq -r .size)" = "$expected_size" || {
              echo "remote asset $name has an unexpected size" >&2
              return 1
            }
            remote_path="$RUNNER_TEMP/final-remote-$asset_id"
            api_get "$remote_path" "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" 'Accept: application/octet-stream'
            cmp -s "$local_path" "$remote_path" || {
              echo "remote asset $name is not byte-identical to the tested asset" >&2
              return 1
            }
          }

          if [ -z "$release_id" ]; then
            body="$(cat "$notes")"
            release_json="$RUNNER_TEMP/created-release.json"
            post_err="$RUNNER_TEMP/create-release.err"
            created=false
            for attempt in {1..6}; do
              if gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
                -f "tag_name=$RELEASE_TAG" \
                -f "name=$release_name" \
                -f "body=$body" \
                -F draft=true -F prerelease=false > "$release_json" 2>"$post_err"; then
                created=true
                break
              fi
              # POST has an unknown-outcome failure mode. Resolve by tag before
              # retrying, and continue only with an exact draft.
              observed="$RUNNER_TEMP/observed-release.json"
              if api_get "$observed" "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"; then
                test "$(jq -r .draft "$observed")" = true || { echo 'release POST found a published release; refusing to edit it' >&2; exit 1; }
                test "$(jq -r .prerelease "$observed")" = false
                test "$(jq -r .name "$observed")" = "$release_name"
                test "$(jq -r .body "$observed" | sha256sum | awk '{print $1}')" = "$notes_digest" || { echo 'release POST found mismatched draft notes' >&2; exit 1; }
                cp "$observed" "$release_json"
                created=true
                break
              fi
              if ! grep -Eiq 'HTTP 404|Not Found' "${observed}.err" 2>/dev/null; then
                echo 'unable to resolve release after unknown POST outcome' >&2
                cat "$post_err" >&2
                exit 1
              fi
              if ! grep -Eiq 'HTTP (408|425|429|5[0-9][0-9])|rate limit|timed out|timeout|temporar|connection reset|TLS handshake' "$post_err"; then
                cat "$post_err" >&2
                exit 1
              fi
              echo "transient release creation failure (attempt $attempt/6); retrying" >&2
              sleep $((attempt * 5))
            done
            test "$created" = true
            test "$(jq -r .tag_name "$release_json")" = "$RELEASE_TAG"
            test "$(jq -r .draft "$release_json")" = true
            test "$(jq -r .prerelease "$release_json")" = false
            test "$(jq -r .name "$release_json")" = "$release_name"
            test "$(jq -r .body "$release_json" | sha256sum | awk '{print $1}')" = "$notes_digest"
            release_id="$(jq -r .id "$release_json")"
            test -n "$release_id"; test "$release_id" != null
            printf '[ ]\n' > "$assets_json"
          fi

          upload_if_missing_or_identical "$BUNDLE" "dist/$BUNDLE" "$bundle_size"
          upload_if_missing_or_identical "$CHECKSUM" "dist/$CHECKSUM" "$checksum_size"

          # Verify names, sizes, bytes, and the checksum asset after upload.
          final_assets="$RUNNER_TEMP/final-assets.json"
          api_get "$final_assets" "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100"
          jq -e --arg bundle "$BUNDLE" --arg checksum "$CHECKSUM" \
            '([.[] | .name] | sort) == ([$bundle, $checksum] | sort)' "$final_assets" >/dev/null || {
            echo 'final release assets are not exactly the tested bundle and checksum' >&2
            exit 1
          }
          verify_remote_asset "$BUNDLE" "dist/$BUNDLE" "$bundle_size"
          verify_remote_asset "$CHECKSUM" "dist/$CHECKSUM" "$checksum_size"

          # Compute an explicit latest policy. A release is latest only when
          # its strict stable SemVer is at least every existing stable release;
          # legacy leaves a newer release's latest pointer untouched.
          releases_file="$RUNNER_TEMP/releases.json"
          api_get_all_releases "$releases_file"
          make_latest="$(jq -r --arg version "$VERSION" '
            def v: capture("^v(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)$") | [(.major | tonumber), (.minor | tonumber), (.patch | tonumber)];
            ([.[] | select((.draft | not) and (.prerelease | not)) | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | v] | max // [0,0,0]) as $max |
            (("v" + $version) | v) as $current |
            if $current >= $max then "true" else "legacy" end
          ' "$releases_file")"

          # Immediately before publishing, authenticate and resolve the tag
          # again.  A retag race leaves this draft safely unpublished.
          final_commit="$(resolve_tag_commit)"
          test "$final_commit" = "$TESTED_COMMIT" || {
            echo "tag moved after validation; leaving draft unpublished" >&2
            exit 1
          }
          patch_err="$RUNNER_TEMP/publish-release.err"
          published=false
          for attempt in {1..6}; do
            if [ "$make_latest" = true ]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                -F draft=false -F make_latest=true > /dev/null 2>"$patch_err" && published=true
            else
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
                -F draft=false -f make_latest=legacy > /dev/null 2>"$patch_err" && published=true
            fi
            [ "$published" = true ] && break
            # A successful PATCH can lose its response. Re-read state before
            # retrying; no overwrite or second publish is attempted.
            state="$RUNNER_TEMP/published-state-$attempt.json"
            if api_get "$state" "repos/$GITHUB_REPOSITORY/releases/$release_id" && [ "$(jq -r .draft "$state")" = false ]; then
              published=true
              break
            fi
            if ! grep -Eiq 'HTTP (408|425|429|5[0-9][0-9])|rate limit|timed out|timeout|temporar|connection reset|TLS handshake' "$patch_err"; then
              cat "$patch_err" >&2
              exit 1
            fi
            echo "transient release promotion failure (attempt $attempt/6); retrying" >&2
            sleep $((attempt * 5))
          done
          test "$published" = true
