name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: MCP format
        run: docker run --rm -v "$PWD:/repo" -w /repo/src/mcp golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 /repo/scripts/check-gofmt.sh /repo/src/mcp
      - name: MCP tests
        run: docker run --rm -v "$PWD/src/mcp:/src" -w /src golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 go test ./...
      - name: MCP race
        run: docker run --rm -v "$PWD/src/mcp:/src" -w /src golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 go test -race ./...
      - name: MCP build
        run: docker run --rm -v "$PWD/src/mcp:/src" -w /src golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 go build ./...
      - name: MCP cross-build portability
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            ./scripts/build-mcp.sh "$RUNNER_TEMP/agentotel-mcp-$os-$arch" "$os" "$arch"
            file "$RUNNER_TEMP/agentotel-mcp-$os-$arch"
          done
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shell syntax and compose config
        run: |
          find obs libexec scripts workload tests -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n bin/obs
          AGENTOTEL_STACK_UUID=00000000-0000-4000-8000-000000000001 AGENTOTEL_PROJECT_ID=00000000-0000-4000-8000-000000000002 GATEWAY_INGEST_TOKEN=ci-ingest-token GATEWAY_QUERY_TOKEN=ci-query-token docker compose --profile demo --profile dashboard config >/dev/null
      - name: CI gate coverage contract
        run: ./scripts/check-ci-gate-coverage.sh
      - name: shellcheck
        run: |
          test_scripts=()
          while IFS= read -r -d '' script; do test_scripts+=("$script"); done < <(find tests -type f -name '*.sh' -print0)
          docker run --rm -v "$PWD:/src" -w /src koalaman/shellcheck-alpine:v0.10.0@sha256:5921d946dac740cbeec2fb1c898747b6105e585130cc7f0602eec9a10f7ddb63 shellcheck -x -e SC1091 bin/obs obs/*.sh libexec/agentotel/*.sh scripts/*.sh workload/*.sh "${test_scripts[@]}"
      - name: Go format
        run: docker run --rm -v "$PWD:/repo" -w /repo/src/gateway golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 /repo/scripts/check-gofmt.sh /repo/src/gateway
      - name: Go tests and race
        run: |
          docker run --rm -v "$PWD/src/gateway:/src" -w /src golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 go test ./...
          docker run --rm -v "$PWD/src/gateway:/src" -w /src golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 go test -race ./...
          docker run --rm -v "$PWD/src/gateway:/src" -w /src golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 go build ./...
      - name: Dashboard Go format
        run: docker run --rm -v "$PWD:/repo" -w /repo/src/dashboard golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 /repo/scripts/check-gofmt.sh /repo/src/dashboard
      - name: Dashboard Go tests, race, vet, and build
        run: |
          docker run --rm -v "$PWD/src/dashboard:/src" -w /src golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 go test ./...
          docker run --rm -v "$PWD/src/dashboard:/src" -w /src golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 go test -race ./...
          docker run --rm -v "$PWD/src/dashboard:/src" -w /src golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 go vet ./...
          docker run --rm -v "$PWD/src/dashboard:/src" -w /src golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 go build ./...
      - name: Dashboard readiness contract
        run: bash tests/runtime/dashboard_readiness.sh
      - name: Dashboard JavaScript state tests
        run: docker run --rm -v "$PWD/src/dashboard:/repo" -w /repo/internal/ui node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32 node --test app_state_test.js
      - name: runtime authoritative checks
        run: tests/runtime/authoritative.sh
      - name: Gateway-only documentation contract
        run: scripts/test-doc-contract.sh
      - name: installed MCP lifecycle
        run: tests/runtime/install_lifecycle.sh
      - name: identity and concurrency checks
        run: bash tests/runtime/identity_concurrency.sh
      - name: setup/reset lifecycle and lock recovery checks
        run: |
          bash tests/runtime/lock_recovery.sh
          bash tests/runtime/setup_concurrency.sh
          bash tests/runtime/lifecycle_concurrency.sh
      - name: dashboard, CLI, and runtime contract checks
        run: |
          bash tests/cli/overview_contract.sh
          bash tests/runtime/dashboard_make_targets.sh
          bash tests/runtime/e2e_trace_readiness.sh
          bash tests/runtime/image_provenance.sh
          bash tests/runtime/compose_project_identity.sh
          bash tests/runtime/compose_network_contract.sh
          bash tests/runtime/ci_port_selection.sh
          bash tests/runtime/credentials_compose.sh
          bash tests/runtime/reset_hermetic.sh
          bash tests/runtime/shell_call_counts.sh
          bash tests/runtime/ci_supply_chain_cleanup.sh
          bash tests/runtime/install_hash_tools.sh
          bash tests/runtime/install_concurrency.sh
      - name: hermetic security, cardinality, and storage checks
        run: |
          ./scripts/test-security.sh
          ./scripts/test-cardinality.sh
          ./scripts/test-storage-pressure.sh
      - name: app tests
        run: docker run --rm -v "$PWD:/src" -w /src/src/app node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32 sh -c 'npm ci && npm test'
      - name: dependency audit
        run: docker run --rm -v "$PWD/src/app:/app" -w /app node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32 sh -c 'npm ci && npm audit --audit-level=high'
      - name: e2e dependency audit
        run: |
          cd e2e
          npm ci
          npm audit --audit-level=high
      - name: JSON, identity, security, cardinality, and reset gates
        run: |
          python3 - <<'PY'
          import json, pathlib
          for path in pathlib.Path('src/gateway/schemas').glob('*.json'):
              json.loads(path.read_text())
          PY
          grep -q 'Authorization' src/gateway/cmd/gateway/main.go
          grep -q 'ValidateProject' src/gateway/cmd/gateway/main.go
          grep -q 'cardinality' libexec/agentotel/storage.sh
          grep -q 'volume identity mismatch' libexec/agentotel/reset.sh
          tmp="$(mktemp -d)"
          stack_id="$(XDG_CONFIG_HOME="$tmp/config" XDG_DATA_HOME="$tmp/data" XDG_STATE_HOME="$tmp/state" libexec/agentotel/dispatch.sh stack-id)"
          printf '%s\n' "$stack_id" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          set +e
          GATEWAY_URL=http://127.0.0.1:1 GATEWAY_QUERY_TOKEN=ci-query-token libexec/agentotel/storage.sh cardinality sample-app >/dev/null 2>&1
          cardinality_rc=$?
          set -e
          test "$cardinality_rc" -eq 2
          test "$(set +e; XDG_CONFIG_HOME=/tmp/agentotel-ci-config XDG_DATA_HOME=/tmp/agentotel-ci-data XDG_STATE_HOME=/tmp/agentotel-ci-state libexec/agentotel/dispatch.sh reset >/dev/null 2>&1; echo $?)" -ne 0
      - name: Release metadata
        env:
          CI_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          version="$(cat VERSION)"
          test -n "$version"
          test "$version" = "$(sed -n 's/^## \([0-9][0-9.]*\).*/\1/p' CHANGELOG.md | head -1)"
          test "$version" = "$(sed -n 's/.*\"version\": \"\([^\"]*\)\".*/\1/p' src/app/package.json | head -1)"
          test "$CI_COMMIT" = "$(git rev-parse HEAD)"
          {
            echo '### Release metadata'
            echo "- version: \`$version\`"
            echo "- commit: \`$CI_COMMIT\`"
            echo "- tag format: \`vMAJOR.MINOR.PATCH\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Release unit tests
        run: |
          ./scripts/verify-release-version.sh
          bash tests/runtime/release_version.sh
          bash tests/release/source_archive.sh
          bash tests/runtime/image_tags_rollback.sh
      - name: image digest and Dockerfile lint
        run: |
          ./scripts/verify-image-provenance.sh
          ./scripts/test-backend-health.sh
          docker run --rm -v "$PWD:/src" -w /src hadolint/hadolint:2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e hadolint src/app/Dockerfile src/dashboard/Dockerfile src/gateway/Dockerfile src/backend-health/Dockerfile.collector src/backend-health/Dockerfile.victorialogs src/backend-health/Dockerfile.victoriametrics src/backend-health/Dockerfile.victoriatraces
      - name: repository hygiene and action validation
        run: |
          git diff --check
          if command -v actionlint >/dev/null 2>&1; then actionlint; fi
          ! rg -n --hidden -g '!*.md' -g '!.git/**' '(AKIA[0-9A-Z]{16}|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|ghp_[A-Za-z0-9]{30,})' .

  live-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: agentotel-ci-${{ github.run_id }}-${{ github.run_attempt }}
      AGENTOTEL_STACK_UUID: 00000000-0000-4000-8000-000000000001
      GATEWAY_INGEST_TOKEN: ci-live-ingest-${{ github.run_id }}
      GATEWAY_QUERY_TOKEN: ci-live-query-${{ github.run_id }}
      RUN_DASHBOARD_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Live stack, workload, contracts, and partial-backend gate
        run: ./scripts/test-ci-integration.sh

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: agentotel-supply-${{ github.run_id }}-${{ github.run_attempt }}
      AGENTOTEL_RUNTIME_VERSION: ci-${{ github.run_id }}-${{ github.run_attempt }}
      AGENTOTEL_STACK_UUID: 00000000-0000-4000-8000-000000000001
      AGENTOTEL_PROJECT_ID: 00000000-0000-4000-8000-000000000002
      GATEWAY_INGEST_TOKEN: scan-ingest-${{ github.run_id }}
      GATEWAY_QUERY_TOKEN: scan-query-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Go vulnerability gate (pinned tool)
        run: |
          docker run --rm -v "$PWD/src/gateway:/src" -w /src golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 \
            sh -ec 'GOBIN=/tmp/bin go install golang.org/x/vuln/cmd/govulncheck@v1.6.0 && /tmp/bin/govulncheck ./...'
          docker run --rm -v "$PWD/src/mcp:/src" -w /src golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 \
            sh -ec 'GOBIN=/tmp/bin go install golang.org/x/vuln/cmd/govulncheck@v1.6.0 && /tmp/bin/govulncheck ./...'
          docker run --rm -v "$PWD/src/dashboard:/src" -w /src golang:1.26.6-bookworm@sha256:116d58cbd88c1297624acc6e967a060012422bacf9930927e23fb719189c6f36 \
            sh -ec 'GOBIN=/tmp/bin go install golang.org/x/vuln/cmd/govulncheck@v1.6.0 && /tmp/bin/govulncheck ./...'
      - name: Build images for scan
        run: |
          # Build-only scan: do not create persistent volumes just to inspect
          # images. If a future step creates resources, the exact-label cleanup
          # helper below is the only permitted cleanup path.
          docker compose --profile demo --profile dashboard build app gateway dashboard victorialogs victoriametrics victoriatraces otel-collector
      - name: Trivy HIGH/CRITICAL gate (pinned image)
        run: |
          set -euo pipefail
          resolved_file="$RUNNER_TEMP/resolved-images.json"
          docker compose --profile demo --profile dashboard config --format json >"$resolved_file"
          jq -e 'all(.services[]; (.build == null) or (.image != null and .image != ""))' "$resolved_file" >/dev/null
          build_image_count="$(jq '[.services[] | select(.build != null) | .image] | length' "$resolved_file")"
          test "$build_image_count" -gt 0
          mapfile -t images < <(jq -r '.services[] | .image // empty' "$resolved_file" | sort -u)
          test "${#images[@]}" -ge "$build_image_count"
          printf '%s\n' "${images[@]}" | grep -Fxq 'busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662'
          # Scan every image resolved by Compose, including non-build runtime
          # images such as the exact pinned BusyBox queue initializer. There is
          # no waiver and no manually maintained omission list.
          for image in "${images[@]}"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.73.0@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c image --exit-code 1 --severity HIGH,CRITICAL "$image"
          done
      - name: Action workflow lint (pinned image)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: Secret scan (pinned gitleaks history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --config=/repo/.gitleaks.toml --source=/repo --redact --no-banner
      - name: Secret scan (pinned gitleaks working tree)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir --config=/repo/.gitleaks.toml --max-target-megabytes=5 --redact --no-banner /repo
      - name: Cleanup scan project
        if: always()
        run: ./scripts/ci-supply-chain-cleanup.sh
