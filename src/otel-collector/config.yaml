# OpenTelemetry Collector (contrib) — single fan-out point for all three signals.
# Receives OTLP from the app, replicates each signal to the matching Victoria* store.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Keep the collector bounded when an exporter or backend is unavailable.
  # This must remain the first processor in every pipeline.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  # Resource shaping is intentionally fail-closed for stream identity.  Remove
  # any caller-supplied project first, then derive the canonical project only
  # from the UUID resource attribute.  The downstream allowlist retains only
  # the low-cardinality project/service/environment dimensions.
  resource/sanitize:
    attributes:
      - key: project
        action: delete
      - key: project
        from_attribute: agentotel.project.id
        action: upsert
      - key: agentotel.project.id
        action: delete
      - key: project.name
        action: delete

  # Common attribute/body shaping after redaction. Keep resource attributes
  # restricted even if a future SDK adds a new high-cardinality resource key.
  transform/resource-allowlist:
    error_mode: propagate
    trace_statements:
      - keep_keys(resource.attributes, ["project", "service.name", "deployment.environment"])
    metric_statements:
      - keep_keys(resource.attributes, ["project", "service.name", "deployment.environment"])
    log_statements:
      - keep_keys(resource.attributes, ["project", "service.name", "deployment.environment"])

  transform/log-sanitize:
    # Propagate OTTL failures so a newly introduced field cannot silently skip
    # the redaction gate.  The collector must fail closed on invalid config.
    error_mode: propagate
    log_statements:
      - context: log
        statements:
          - delete_key(attributes, "http.request.body")
          - delete_key(attributes, "http.response.body")
          - delete_key(attributes, "request.body")
          - delete_key(attributes, "response.body")
          - delete_key(attributes, "db.statement")
          - delete_key(attributes, "db.query.text")
          - delete_key(attributes, "gen_ai.prompt")
          - delete_key(attributes, "gen_ai.completion")
          - delete_key(attributes, "gen_ai.input.messages")
          - delete_key(attributes, "gen_ai.output.messages")
          - delete_key(attributes, "authorization")
          - delete_key(attributes, "cookie")
          - delete_key(attributes, "api_key")
          - delete_key(attributes, "api.key")
          - delete_key(attributes, "vcs.repository.url.full")
          - delete_key(attributes, "vcs.repository.url")
          - delete_key(attributes, "vcs.user")
          # Stable URL query/fragment components can carry caller secrets; keep
          # host/path context but remove these standalone values outright.
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "url.fragment")
          - replace_pattern(attributes["http.url"], "[?#].*$", "") where attributes["http.url"] != nil
          - replace_pattern(attributes["url.full"], "[?#].*$", "") where attributes["url.full"] != nil
          - replace_pattern(attributes["http.request.header.authorization"], ".+", "[REDACTED]") where attributes["http.request.header.authorization"] != nil
          - replace_pattern(attributes["http.request.header.cookie"], ".+", "[REDACTED]") where attributes["http.request.header.cookie"] != nil
          - replace_pattern(body, "(?i)(authorization|cookie|api[_-]?key|access[_-]?token|password|secret)[=:][^,; ]+", "$1=[REDACTED]") where IsString(body)
          - replace_pattern(body, "(?i)(https?://[^?#\\s]+)[?#][^\\s]*", "$1") where IsString(body)

  transform/metric-sanitize:
    error_mode: propagate
    metric_statements:
      - context: datapoint
        statements:
          # Metric labels are an explicit bounded contract. `outcome` is the
          # only datapoint attribute emitted by the sample app and is required
          # by the orders_processed_total queries; future labels are dropped
          # by default rather than merely being added to a denylist.
          - keep_keys(attributes, ["outcome"])

  transform/trace-sanitize:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "http.request.body")
          - delete_key(attributes, "http.response.body")
          - delete_key(attributes, "request.body")
          - delete_key(attributes, "response.body")
          - delete_key(attributes, "db.statement")
          - delete_key(attributes, "db.query.text")
          - delete_key(attributes, "gen_ai.prompt")
          - delete_key(attributes, "gen_ai.completion")
          - delete_key(attributes, "gen_ai.input.messages")
          - delete_key(attributes, "gen_ai.output.messages")
          # Stable URL query/fragment components can carry caller secrets; keep
          # host/path context but remove these standalone values outright.
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "url.fragment")
          - replace_pattern(attributes["http.request.header.authorization"], ".+", "[REDACTED]") where attributes["http.request.header.authorization"] != nil
          - replace_pattern(attributes["http.request.header.cookie"], ".+", "[REDACTED]") where attributes["http.request.header.cookie"] != nil
          - replace_pattern(attributes["http.url"], "[?#].*$", "") where attributes["http.url"] != nil
          - replace_pattern(attributes["http.target"], "[?#].*$", "") where attributes["http.target"] != nil
          - replace_pattern(attributes["url.full"], "[?#].*$", "") where attributes["url.full"] != nil
          - delete_key(attributes, "vcs.repository.url.full")
          - delete_key(attributes, "vcs.repository.url")
          - delete_key(attributes, "vcs.user")
          - delete_key(attributes, "vcs.ref.head.name")
      - context: spanevent
        statements:
          - delete_key(attributes, "http.request.body")
          - delete_key(attributes, "http.response.body")
          - delete_key(attributes, "request.body")
          - delete_key(attributes, "response.body")
          - delete_key(attributes, "db.statement")
          - delete_key(attributes, "db.query.text")
          - delete_key(attributes, "gen_ai.prompt")
          - delete_key(attributes, "gen_ai.completion")
          - delete_key(attributes, "gen_ai.input.messages")
          - delete_key(attributes, "gen_ai.output.messages")
          - delete_key(attributes, "authorization")
          - delete_key(attributes, "cookie")
          - delete_key(attributes, "api_key")
          - delete_key(attributes, "api.key")
          - delete_key(attributes, "vcs.repository.url.full")
          - delete_key(attributes, "vcs.repository.url")
          - delete_key(attributes, "vcs.user")
          # Apply the same URL-component policy to span-event attributes.
          - delete_key(attributes, "url.query")
          - delete_key(attributes, "url.fragment")
          - replace_pattern(attributes["http.request.header.authorization"], ".+", "[REDACTED]") where attributes["http.request.header.authorization"] != nil
          - replace_pattern(attributes["http.request.header.cookie"], ".+", "[REDACTED]") where attributes["http.request.header.cookie"] != nil
          - replace_pattern(attributes["http.url"], "[?#].*$", "") where attributes["http.url"] != nil
          - replace_pattern(attributes["url.full"], "[?#].*$", "") where attributes["url.full"] != nil

  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 1024

  resource_detection:
    detectors: [env]
    timeout: 2s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: /var/lib/otelcol/queue
    create_directory: true

exporters:
  # Logs -> VictoriaLogs OTLP endpoint
  otlp_http/vlogs:
    logs_endpoint: http://victorialogs:9428/insert/opentelemetry/v1/logs
    # VictoriaLogs treats resource attributes as stream fields by default;
    # pin the canonical low-cardinality set explicitly at the exporter boundary.
    headers:
      VL-Stream-Fields: project,service.name,deployment.environment
    tls:
      insecure: true
    timeout: 10s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 30s

  # Metrics -> VictoriaMetrics OTLP endpoint
  otlp_http/vmetrics:
    metrics_endpoint: http://victoriametrics:8428/opentelemetry/v1/metrics
    tls:
      insecure: true
    timeout: 10s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 30s

  # Traces -> VictoriaTraces OTLP endpoint
  otlp_http/vtraces:
    traces_endpoint: http://victoriatraces:10428/insert/opentelemetry/v1/traces
    tls:
      insecure: true
    timeout: 10s
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1000
      storage: file_storage
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 30s

service:
  telemetry:
    logs:
      level: info
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, resource/sanitize, transform/resource-allowlist, transform/log-sanitize, batch]
      exporters: [otlp_http/vlogs]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, resource/sanitize, transform/resource-allowlist, transform/metric-sanitize, batch]
      exporters: [otlp_http/vmetrics]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, resource/sanitize, transform/resource-allowlist, transform/trace-sanitize, batch]
      exporters: [otlp_http/vtraces]
  extensions: [file_storage, health_check]
