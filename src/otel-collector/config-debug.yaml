# Explicit opt-in local debugging configuration. This is intentionally not
# mounted by docker-compose.yml; use it only for short-lived troubleshooting.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  memory_limiter: { check_interval: 1s, limit_mib: 256, spike_limit_mib: 64 }
  batch: { timeout: 1s, send_batch_size: 1024, send_batch_max_size: 1024 }
exporters:
  debug:
    verbosity: basic
service:
  pipelines:
    logs: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }
    metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }
    traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug] }
